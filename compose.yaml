name: worst-workout
services:
  web:
    build:
      context: .
      dockerfile: site/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-3000}:8787"
    volumes:
      - workout-data:/app/site/.wrangler/state
    environment:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    stop_grace_period: 20s
volumes:
  workout-data:
