services:
  caddy:
    image: caddy:2.11.9-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?Set SITE_DOMAIN to your public hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
